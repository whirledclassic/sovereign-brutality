<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<meta property="og:site_name" content="Sovereign Brutality"/>
<meta property="og:title" content="Roster — Sovereign Brutality"/>
<meta property="og:description" content="Official Sovereign Brutality roster. Johnny Motta, Freakin Flax, Mighty Mac, Tucker Remy, Cowboy Willy."/>
<meta property="og:url" content="https://sovereignbrutality.com/roster.html"/>
<meta property="og:image" content="https://i.imgur.com/o3dZ4jI.jpeg"/>
<meta property="og:image:type" content="image/jpeg"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Roster — Sovereign Brutality"/>
<meta name="twitter:description" content="Official Sovereign Brutality roster. Johnny Motta, Freakin Flax, Mighty Mac, Tucker Remy, Cowboy Willy."/>

<meta name="description" content="Official Sovereign Brutality roster. Johnny Motta, Freakin Flax, Mighty Mac, Tucker Remy, Cowboy Willy."/>
<title>Roster — Sovereign Brutality</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="site.css"/>
<style>
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:28px}
.wcard{position:relative;background:linear-gradient(180deg,#141414 0%,#080808 100%);border:1px solid #2a2a2a;min-height:340px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.wcard.filled{border-color:#3a2022}
.sil{height:240px;background:radial-gradient(ellipse at 50% 80%,rgba(196,18,26,.22),transparent 55%),repeating-linear-gradient(-45deg,#101010 0 10px,#0c0c0c 10px 20px);display:grid;place-items:center;position:relative;overflow:hidden}
.sil img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.sil svg{width:92px;height:92px;opacity:.28}
.stamp{position:absolute;top:12px;left:12px;border:1px solid var(--hot);color:var(--hot);font-family:Oswald,sans-serif;letter-spacing:.22em;font-size:.62rem;padding:3px 7px;background:#000c}
.numtag{position:absolute;top:12px;right:12px;font-family:"Bebas Neue",sans-serif;color:#eee;font-size:1.1rem;text-shadow:0 1px 4px #000}
.body{padding:14px 14px 16px;flex:1;display:flex;flex-direction:column}
.body h3{font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem;color:var(--chrome);margin:0 0 6px}
.meta{font-size:.78rem;color:#8d8d8d;line-height:1.45}
.meta b{color:#bbb;font-weight:600}
.fill{margin-top:auto;padding-top:12px;font-family:Oswald,sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem;color:var(--hot)}
</style>
</head>
<body>
<div class="wire-x t"></div><div class="wire-x b"></div>
<div class="wire-y l"></div><div class="wire-y r"></div>
<script src="nav.js"></script>
<div class="page-hero">
  <div class="coming">20 SPOTS • 5 NAMES</div>
  <h1>OFFICIAL <em>ROSTER</em></h1>
  <div class="rule"></div>
  <p class="lead">The founding wall. Five names are up. Fifteen spots are still open. No titles yet.</p>
</div>
<section>
  <div class="roster-grid" id="wall"></div>
</section>
<footer>
  <div><strong style="color:#bbb">Sovereign Brutality</strong><br/>Rhode Island independent wrestling</div>
  <div><a href="talent.html" style="color:#888">Talent</a> · <a href="apply.html" style="color:#888">Apply</a></div>
</footer>
<script>
(function(){
  var person = '<svg viewBox="0 0 64 64" fill="#d7dbe2" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="18" r="10"/><path d="M12 58c2-16 10-24 20-24s18 8 20 24"/></svg>';
  var roster = [
    {
      name: "Johnny Motta",
      nick: "The Brawl-Father",
      from: "New England",
      size: "— / —",
      note: "Brazil colors. Veteran independent.",
      img: "assets/roster/johnny-motta.jpg"
    },
    {
      name: "Freakin Flax",
      nick: "The Goat With The Most",
      from: "New Hampshire",
      size: "5'4\" / 150",
      note: "Comedy. Death Trap Headlock.",
      img: "assets/roster/freakin-flax.jpg"
    },
    {
      name: "Mighty Mac",
      nick: "Fight Club",
      from: "—",
      size: "— / —",
      note: "Old-school hands. Black and gold.",
      img: "assets/roster/mighty-mac.jpg"
    },
    {
      name: "Tucker Remy",
      nick: "The Purge Personified",
      from: "New England",
      size: "— / —",
      note: "Face paint. The bat comes with him.",
      img: "assets/roster/tucker-remy.jpg"
    },
    {
      name: "Cowboy Willy",
      nick: "The Cowboy",
      from: "—",
      size: "— / —",
      note: "Hat. Chaps. Arms crossed.",
      img: "assets/roster/cowboy-willy.jpg"
    }
  ];
  var wall = document.getElementById("wall");
  roster.forEach(function(w, i){
    var n = (i < 9 ? "0" : "") + (i + 1);
    var a = document.createElement("a");
    a.className = "wcard filled";
    a.href = "#";
    a.innerHTML = '<div class="sil"><img src="'+w.img+'" alt="'+w.name+' promo"/><span class="stamp">ROSTER</span><span class="numtag">'+n+'</span></div>'+
      '<div class="body"><h3>'+w.name+'</h3>'+
      '<div class="meta"><b>Name</b> '+w.nick+'<br/><b>From</b> '+w.from+'<br/><b>Size</b> '+w.size+'<br/><b>Note</b> '+w.note+'</div>'+
      '<div class="fill">On the wall</div></div>';
    wall.appendChild(a);
  });
  for (var i = roster.length + 1; i <= 20; i++) {
    var n = (i < 10 ? "0" : "") + i;
    var label = "Roster Member " + n;
    var a = document.createElement("a");
    a.className = "wcard";
    a.href = "apply.html?slot=" + encodeURIComponent(label);
    a.innerHTML = '<div class="sil">'+person+'<span class="stamp">VACANT</span><span class="numtag">'+n+'</span></div>'+
      '<div class="body"><h3>'+label+'</h3>'+
      '<div class="meta"><b>Name</b> —<br/><b>From</b> —<br/><b>Size</b> — / —<br/><b>Finisher</b> —</div>'+
      '<div class="fill">Coming soon</div></div>';
    wall.appendChild(a);
  }
})();
</script>
</body>
</html>
