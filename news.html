<style>
.feed{max-width:760px;margin:0 auto;display:grid;gap:18px}
.post{background:linear-gradient(180deg,#141414,#0a0a0a);border:1px solid #2a2a2a;border-left:3px solid var(--blood);padding:22px 24px}
.post-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-family:Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:.7rem;color:#8d8d8d}
.post-tag{border:1px solid var(--blood);color:var(--hot);padding:2px 7px;letter-spacing:.18em}
.post h3{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--chrome);font-size:1.15rem;margin-bottom:8px}
.post p{color:#cfcfcf}
.post-link{display:inline-block;margin-top:12px;font-family:Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--hot);text-decoration:none}
.post-link:hover{color:#fff}
.empty{border:1px dashed #333;background:#0a0a0a;padding:36px 24px;text-align:center}
.empty h3{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--chrome);font-size:1rem;margin-bottom:8px}
.empty p{color:#aaa;font-size:.95rem}
.feed .post ~ .empty{display:none}
</style>
</head>
<body>
<div class="wire-x t"></div><div class="wire-x b"></div>
<div class="wire-y l"></div><div class="wire-y r"></div>
<script src="nav.js"></script>
<div class="page-hero">
  <div class="coming">COMPANY UPDATES</div>
  <h1>THE <em>NEWS</em> DESK</h1>
  <div class="rule"></div>
  <p class="lead">Announcements, sponsor posts, and company updates. Only what is real.</p>
</div>
<section style="padding-top:0">
  <div class="feed" id="news-feed">
    <!--
      HOW TO ADD A POST
      1. Copy the TEMPLATE block below (everything from <article class="post"> to </article>).
      2. Paste it right under this comment so the newest post is always first.
      3. Fill in the date, tag (Announcement, Sponsor, Event, Roster...), title, and body.
      4. The link line is optional - delete it if the post has no link.
      The "No posts yet" box hides itself automatically once one real post is above it.

      TEMPLATE (copy from here):
      <article class="post">
        <div class="post-meta"><time datetime="2026-01-31">Jan 31, 2026</time><span class="post-tag">Announcement</span></div>
        <h3>Post title goes here</h3>
        <p>Write the update here. Keep it short and true.</p>
        <a class="post-link" href="https://example.com" target="_blank" rel="noopener">Read more →</a>
      </article>
      (copy to here)
    -->

    <!-- NEW POSTS GO HERE, NEWEST FIRST -->

    <div class="empty">
      <h3>No posts yet</h3>
      <p>Company updates, announcements, and sponsor news will show up here when there is something real to say.</p>
    </div>
  </div>
</section>
<footer>
  <div><strong style="color:#bbb">Sovereign Brutality</strong><br/>Rhode Island independent wrestling</div>
  <div>© 2026</div>
</footer>
</body>
